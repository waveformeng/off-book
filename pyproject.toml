[project]
name = "offbook"
version = "0.1.0"
description = "Waveform Karaoke — Off Book: dual-stream scoring engine"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.30",
    "parakeet-mlx>=0.3",
    "numpy>=2.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "pydantic>=2.9",
    "rich>=13.9",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
offbook = "offbook.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offbook"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
exclude = ["tests/typing_fixtures/"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mlx.nn re-exports its layers with a star import that mypy cannot see through.
module = "offbook.asr.mlx_wav2vec2.model"
disallow_subclassing_any = false
disable_error_code = ["attr-defined", "name-defined", "no-any-return"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
exclude = ["tests/typing_fixtures/*"]
select = ["E", "F", "I", "UP", "B"]
# The Role TypeVar is deliberately explicit (see offbook.roles); keep Generic[Role].
ignore = ["UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
