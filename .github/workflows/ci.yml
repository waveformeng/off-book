name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Apple Silicon: mlx needs it to import.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q
      - name: session schema is up to date
        run: |
          uv run offbook schema --out /tmp/session.schema.json
          diff -u schema/session.schema.json /tmp/session.schema.json
